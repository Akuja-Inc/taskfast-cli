[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unused-ignored-advisory = "deny"
# cargo-deny 0.22.0 (via cargo-deny-action v2.1.3) changed this default from "all"
# to "workspace". The ignores below cover unmaintained *transitive* crates, so keep
# the "all" scope or `unused-ignored-advisory` fails them as never encountered.
unmaintained = "all"
ignore = [
    # paste — unmaintained, deep transitive of alloy/ark-* macro tree
    "RUSTSEC-2024-0436",
    # unsafe-libyaml — unmaintained; via serde_yaml in progenitor/taskfast-codegen (build script + xtask only, not in the shipped binary). No safe upgrade upstream.
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# taskfast-cli dev-depends on itself (path-only) so its integration tests get
# the `test-support` feature; cargo drops that dev-dependency when packaging.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
