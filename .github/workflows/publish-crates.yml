# Publishes the workspace crates to crates.io in dependency (topological) order.
#
# Why a separate workflow (not dist's release.yml):
#   cargo-dist 0.31 has no native crates.io-publish host step (its publish-jobs
#   cover homebrew/npm only). release.yml ships binary release artifacts; this
#   workflow handles the registry side so `cargo install taskfast-cli` works.
#   Mirrors the repo's existing pattern of hand-augmenting dist CI.
#
# Publish order is load-bearing — cargo publish drops path overrides and
# resolves version reqs against crates.io, so each crate's workspace deps must
# already be on the registry:
#
#   taskfast-codegen -> taskfast-client -> taskfast-agent -> taskfast-cli
#   taskfast-chains  (independent)
#
# Safety: the dry-run step has no publish token. Before any upload every
# release crate version is checked against the crates.io sparse index; a
# version already there fails the release, because the upload would skip it
# and ship the registry copy. Only the `recover` dispatch input, run from the
# release tag, skips versions already published, to finish a partial release.
# The upload step alone holds the token and runs only from the release tag.
#
# Triggers:
#   * workflow_dispatch (manual) — `dry_run` validates packaging and metadata
#     without uploading, building every crate against its siblings; `recover`
#     finishes a partial release from the release tag.
#   * push of a version tag (taskfast-cli-v* or bare vX.Y.Z) — automates the
#     registry publish on each release, alongside the binary release.yml run.
#
# Requires the CARGO_REGISTRY_TOKEN repo secret (crates.io publish token). The
# owning crates.io account MUST have a verified email address, or every upload
# fails with HTTP 400 "A verified email address is required".

name: publish-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate packaging/metadata without uploading (cargo publish --dry-run)"
        type: boolean
        default: false
      recover:
        description: "Recovery mode: finish a partial release by skipping versions already on crates.io (run from the release tag)"
        type: boolean
        default: false
  push:
    tags:
      - 'taskfast-cli-v*'
      - 'v*'

jobs:
  publish:
    name: publish to crates.io
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Dry-run (no publish token)
        if: ${{ !inputs.recover || inputs.dry_run }}
        run: scripts/publish-dry-run.sh

      - name: Upload to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RECOVER: ${{ inputs.recover }}
        run: scripts/publish-release.sh

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry-run publish validation complete: every crate was packaged and built against its sibling crates, nothing uploaded."
          echo "For the real publish, push the release tag (requires CARGO_REGISTRY_TOKEN + a verified email on the owning crates.io account)."
