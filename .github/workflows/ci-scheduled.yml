# Advisory scheduled health checks, intentionally split out of ci.yml.
#
# ci.yml is the gating workflow (PR + push) whose status badge is the
# project's public health signal. These jobs are schedule/dispatch only
# and historically flap because they pull ancient transitive crates
# (minimal-versions) or depend on staging reachability (spec-upstream-drift).
# Running them inside ci.yml meant a flaky advisory job turned the main CI
# badge red even when every gating check passed. Keeping them here means:
#   * the ci.yml badge reflects real code health, and
#   * advisory failures still run on schedule and notify Discord,
#     without reddening the gating workflow.
#
# This workflow has no `pull_request`/`push` triggers by design.

name: CI (scheduled)

on:
  schedule:
    # Monday 07:00 UTC — weekly advisory health checks.
    - cron: '0 7 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  minimal-versions:
    # Catches under-pinned semver ranges in our own manifests. Pulls the
    # oldest version satisfying each *direct* dependency's constraint (deps
    # of deps resolve to their newest) and tries to build. Full
    # `-Z minimal-versions` was red every week on transitive crates we don't
    # control (getrandom 0.1 via eth-keystore→uuid 0.8 doesn't compile on
    # modern nightly), which hid real floor bugs (chrono `clock`,
    # rust_decimal `std` features missing at the declared floor).
    name: minimal-versions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo +nightly build --workspace --locked

  spec-upstream-drift:
    # Fetches the live server OpenAPI spec; when the vendored copy is stale,
    # re-vendors it and opens (or updates) a `bot/spec-refresh` PR. A failing
    # job alone sat red for six weeks unacted on, so the refresh PR is the
    # signal now. Scheduled/dispatch only — never gates PRs, so a server-side
    # deploy can't turn unrelated CLI PRs red, and the job doesn't depend on
    # staging being reachable during PR review. Staging unreachable (drift
    # check exit 2) still fails the job. This is the proactive half of the
    # gh#51 stale-spec guard.
    #
    # PRs opened with GITHUB_TOKEN don't trigger `pull_request` workflows, so
    # the job dispatches ci.yml on the branch; its checks land on the PR head.
    name: spec-upstream-drift
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check upstream drift
        id: drift
        run: |
          rc=0
          scripts/check-spec-drift.sh --upstream || rc=$?
          case "$rc" in
            0) echo "stale=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "stale=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      # vendor-spec.sh records server_commit = "unknown" here: GITHUB_TOKEN
      # can't read the private server repo. sha256 and fetched_at still pin it.
      - name: Re-vendor spec
        if: steps.drift.outputs.stale == 'true'
        run: scripts/vendor-spec.sh
      # Drafted so the PR passes the changelog-entry gate; the reviewer rewords it.
      - name: Draft CHANGELOG entry
        if: steps.drift.outputs.stale == 'true'
        run: scripts/draft-spec-changelog.sh
      - name: Open refresh PR
        if: steps.drift.outputs.stale == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/spec-refresh
          delete-branch: true
          commit-message: "chore(spec): re-vendor OpenAPI spec from staging"
          title: "chore(spec): re-vendor OpenAPI spec from staging"
          body: |
            Automated by the `spec-upstream-drift` job in `ci-scheduled.yml`: staging's
            `/api/docs/spec` no longer matches `spec/openapi.provenance.toml`.

            CI was dispatched on this branch; a red build means the server spec changed
            in a way the generated client can't absorb.

            A `## Unreleased` CHANGELOG entry was drafted from added/removed operationIds.
            Before merging, reword it to name changed schemas or behavior
            (`git diff origin/main -- spec/openapi.yaml`).
      - name: Run CI on the refresh branch
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref bot/spec-refresh

  notify-discord:
    # Mirrors the notify pattern in ci.yml / docker.yml, but only aggregates
    # the advisory scheduled jobs in this workflow.
    name: Notify Discord
    if: ${{ always() }}
    needs:
      - minimal-versions
      - spec-upstream-drift
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      CI_RESULT: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
    steps:
      - name: Compute run summary
        id: summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          format_duration() {
            local total_seconds=$1
            local hours=$((total_seconds / 3600))
            local minutes=$(((total_seconds % 3600) / 60))
            local seconds=$((total_seconds % 60))
            printf '%02dh %02dm %02ds' "$hours" "$minutes" "$seconds"
          }

          run_started_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.run_started_at')
          start_epoch=$(date -d "$run_started_at" +%s)
          now_epoch=$(date +%s)
          duration=$(format_duration $((now_epoch - start_epoch)))

          if [[ "$CI_RESULT" == "success" ]]; then
            status="passed"
            emoji="✅"
          else
            status="failed"
            emoji="❌"
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "emoji=$emoji" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Actions for Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ env.DISCORD_WEBHOOK }}
        with:
          args: |
            ${{ steps.summary.outputs.emoji }} CI-scheduled (advisory) ${{ steps.summary.outputs.status }} for `${{ github.repository }}`
            `Branch  :` [${{ github.ref_name }}](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }})
            `SHA     :` [`${{ steps.summary.outputs.sha_short }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            `Event   :` `${{ github.event_name }}`
            `Duration:` `${{ steps.summary.outputs.duration }}`
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
